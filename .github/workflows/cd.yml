name: CD

on:
  push:
    branches:
      - main
      - master

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/git-test-app

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 编译阶段
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 2. 测试阶段
      - name: Run tests
        run: mvn test

      # 3. 打包阶段
      - name: Build jar
        run: mvn clean package -DskipTests

      # 4. 构建和推送 Docker 镜像
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. 部署到远程服务器
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            # 设置变量
            IMAGE_NAME="${{ env.IMAGE_NAME }}:latest"
            CONTAINER_NAME="git-test-app"
            MYSQL_CONTAINER_NAME="git-test-mysql"

            # 登录 GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 拉取最新镜像（带重试机制）
            echo "Pulling latest image..."
            MAX_RETRIES=3
            RETRY_COUNT=0
            until docker pull $IMAGE_NAME || [ $RETRY_COUNT -eq $MAX_RETRIES ]; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "Pull failed, retrying ($RETRY_COUNT/$MAX_RETRIES)..."
              sleep 10
            done

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "Failed to pull image after $MAX_RETRIES attempts"
              exit 1
            fi

            # 检查应用容器是否存在
            if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              echo "Container ${CONTAINER_NAME} exists, stopping and removing..."
              docker stop $CONTAINER_NAME
              docker rm $CONTAINER_NAME
            else
              echo "Container ${CONTAINER_NAME} does not exist, will create new one"
            fi

            # 检查 MySQL 容器是否存在
            if ! docker ps --format '{{.Names}}' | grep -q "^${MYSQL_CONTAINER_NAME}$"; then
              echo "MySQL container does not exist, creating..."
              docker run -d \
                --name $MYSQL_CONTAINER_NAME \
                --restart unless-stopped \
                -e MYSQL_ROOT_PASSWORD=mysql \
                -e MYSQL_DATABASE=gittest \
                -e MYSQL_USER=gittest \
                -e MYSQL_PASSWORD=mysql \
                -e TZ=Asia/Shanghai \
                -p 3306:3306 \
                mysql:8.4 \
                --character-set-server=utf8mb4 \
                --collation-server=utf8mb4_0900_ai_ci \
                --default-time-zone=+08:00

              # 等待 MySQL 启动
              echo "Waiting for MySQL to be ready..."
              sleep 30
            else
              echo "MySQL container already running"
            fi

            # 启动应用容器
            echo "Starting application container..."
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              --link $MYSQL_CONTAINER_NAME:mysql \
              -e SERVER_PORT=7070 \
              -e SPRING_DATASOURCE_URL="jdbc:mysql://mysql:3306/gittest?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false" \
              -e SPRING_DATASOURCE_USERNAME=gittest \
              -e SPRING_DATASOURCE_PASSWORD=mysql \
              -e TZ=Asia/Shanghai \
              -p 7070:7070 \
              $IMAGE_NAME

            # 清理未使用的镜像
            echo "Cleaning up unused images..."
            docker image prune -f

            # 显示运行状态
            echo "Deployment completed. Container status:"
            docker ps --filter "name=${CONTAINER_NAME}"

            # 显示日志（最后20行）
            echo "Application logs:"
            sleep 5
            docker logs --tail 20 $CONTAINER_NAME
