services:
  mysql:
    image: mysql:8.4
    container_name: git-test-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gittest}
      MYSQL_USER: ${MYSQL_USER:-gittest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gittest_password}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: git-test-app:latest
    container_name: git-test-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 7070
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gittest}?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-gittest}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-gittest_password}
      TZ: Asia/Shanghai
    ports:
      - "${APP_HOST_PORT:-7070}:7070"

volumes:
  mysql_data:
